<!-- HTML template for the frontend react app: https://developer.mozilla.org/en-US/docs/Web/HTML --><!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Metadados do LIVRO (comando 3, item 3). O que estava aqui: lang="en"
         (site em português), author "Skip" (a plataforma, não o autor) e uma
         descrição quebrada em três linhas no meio da frase. -->
    <title>Guia Masterclass de Implementação WMS — Eduardo Canal</title>
    <meta
      name="description"
      content="O guia prático para implementar WMS em operação logística in house: integrar ERP, escolher o sistema e construir a base para a eficiência do armazém. Por Eduardo Canal."
    />
    <meta name="author" content="Eduardo Canal" />
    <meta name="keywords" content="WMS, logística, armazém, picking, ERP, in house, implementação" />

    <!-- Open Graph: o título e a descrição repetem os da página; a imagem é a
         capa do livro, que é o que identifica o produto quando o link circula. -->
    <meta property="og:type" content="book" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Guia Masterclass de Implementação WMS — Eduardo Canal" />
    <meta
      property="og:description"
      content="O guia prático para implementar WMS em operação logística in house: integrar ERP, escolher o sistema e construir a base para a eficiência do armazém."
    />
    <!-- A capa é processada pelo bundler (o hash no nome é do build), então a
         URL estável é /og-image.png — o arquivo público que o projeto já tem.
         Apontar para /assets/capa-livro.jpg daria 404 em produção. -->
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <div id="root"></div>
    <!-- @skip-protected: Do not remove. Required for app features. -->
    <script src="https://goskip.dev/skip.js"></script>
    <!-- @skip-protected: Do not remove. App entrypoint. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
